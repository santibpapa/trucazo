<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1A0F10">
    <meta name="color-scheme" content="dark">
    <meta name="robots" content="noindex, nofollow">
    <title>Sin conexión · Trucazo</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #1A0F10; color: #EFE6DA; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 360px; text-align: center; }
      .brand { margin: 0 0 32px; color: #C9A24B; font-size: 28px; font-weight: 800; letter-spacing: 2px; }
      svg { width: 48px; height: 48px; color: #A78A86; }
      h1 { margin: 20px 0 12px; font-size: 26px; }
      p { font-size: 17px; line-height: 1.6; color: #A78A86; }
      a { display: block; margin-top: 28px; padding: 16px; border-radius: 16px; background: #C9A24B; color: #1F1011; font-size: 17px; font-weight: 700; text-decoration: none; }
      a:hover { background: #D7B566; }
      a:focus-visible { outline: 3px solid #EFE6DA; outline-offset: 4px; }
      #connection { min-height: 28px; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">TRUCAZO</p>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M2 2l20 20M8.5 8.5a10 10 0 0 1 10 2M5 10.5a10 10 0 0 1 1.2-1M8 14a6 6 0 0 1 3.5-1M12 18h.01M16 6a16 16 0 0 1 6 3M2 9a16 16 0 0 1 9-3" />
      </svg>
      <h1>No pudimos conectar</h1>
      <p>Revisá tu conexión y volvé a intentar.</p>
      <a id="retry" href="/">Volver a intentar</a>
      <p id="connection" role="status" aria-live="polite"></p>
    </main>
    <script>
      // La recuperación se sirve en la URL original: conservar torneo/partida
      // y sus parámetros al reintentar. No insertar datos de la URL en el HTML.
      const retry = document.getElementById('retry')
      if (location.pathname !== '/offline.html') {
        retry.href = location.pathname + location.search + location.hash
        retry.addEventListener('click', (event) => {
          event.preventDefault()
          location.reload()
        })
      }
      const connection = document.getElementById('connection')
      window.addEventListener('online', () => {
        connection.textContent = 'La conexión volvió. Tocá «Volver a intentar».'
      })
      window.addEventListener('offline', () => { connection.textContent = '' })
    </script>
  </body>
</html>
